# CI/CD Pipeline for Restaurant Wizard
# Automatically builds and deploys to Firebase Hosting when PRs are merged to master

name: Build and Deploy to Production

on:
  push:
    branches:
      - master
      - main
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install dependencies for main project
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Step 4: Install dependencies for Firebase Functions
      - name: Install functions dependencies
        run: cd functions && npm ci

      # Step 5: Build the React application
      - name: Build React app
        run: npm run build
        env:
          CI: false  # Prevents treating warnings as errors

      # Step 6: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: restaurant-portal-6b147
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      # Step 7: Deploy Firebase Functions (optional - uncomment if needed)
      # - name: Deploy Firebase Functions
      #   run: npx firebase-tools deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
